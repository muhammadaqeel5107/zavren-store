<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZAVRÉN — Store Portal</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f4f1;color:#171717;font:14px Arial,sans-serif}.wrap{max-width:1120px;margin:32px auto;padding:0 16px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}h1{letter-spacing:.12em;font-size:22px}.panel{background:#fff;border:1px solid #e5e5e5;border-radius:14px;padding:20px;margin-bottom:16px}.login{max-width:420px;margin:10vh auto}label{display:block;font-weight:bold;margin:12px 0 6px}input,textarea,select{width:100%;padding:11px;border:1px solid #ccc;border-radius:7px;background:white;color:#171717}textarea{min-height:75px}button{padding:10px 14px;border:0;border-radius:7px;background:#171717;color:white;cursor:pointer}button:disabled{opacity:.6}.hide{display:none}.muted{color:#666}.error{color:#a22}.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}.tab.active{background:#b68a27}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.sizes{display:flex;gap:14px;flex-wrap:wrap}.sizes label{display:flex;align-items:center;gap:5px;margin:5px 0}.sizes input{width:auto}.product{display:grid;grid-template-columns:100px 1fr auto;gap:14px;align-items:center;border-top:1px solid #eee;padding:14px 0}.product img{width:100px;height:100px;object-fit:cover;background:#eee;border-radius:8px}.product-actions{display:flex;gap:7px;flex-wrap:wrap}.danger{background:#9e2929}.order{margin:12px 0;border:1px solid #e8e8e8;border-radius:10px;padding:15px}.orderhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.ordergrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.preview{max-width:130px;max-height:130px;display:block;margin-top:8px;border-radius:8px}.notice{padding:10px;background:#f7f4e9;border-radius:8px;margin:10px 0}@media(max-width:650px){.grid,.ordergrid{grid-template-columns:1fr}.product{grid-template-columns:76px 1fr}.product img{width:76px;height:76px}.product-actions{grid-column:2}}
</style></head><body><main class="wrap"><header><h1>ZAVRÉN / STORE PORTAL</h1><button id="logout" class="hide" onclick="logout()">LOG OUT</button></header>
<section id="login" class="panel login"><h2>Admin sign in</h2><p class="muted">Private store management portal</p><form id="loginForm"><label>Username</label><input name="username" value="admin" required><label>Password</label><input name="password" type="password" required><p id="loginError" class="error"></p><button>SIGN IN</button></form></section>
<section id="dashboard" class="hide"><div class="tabs"><button class="tab active" id="productsTab" onclick="showTab('products')">PRODUCTS</button><button class="tab" id="ordersTab" onclick="showTab('orders')">ORDERS</button></div>
<div id="productsView"><div class="panel"><h2 id="formTitle">Add a product</h2><p class="muted">Yahan product ki photo upload karein, naam, price aur sizes set karein. Save karte hi website par show hoga.</p><form id="productForm"><input type="hidden" id="productId"><div class="grid"><div><label>Product name *</label><input id="pName" maxlength="100" required placeholder="e.g. Z Signature Tee"></div><div><label>Price (PKR) *</label><input id="pPrice" type="number" min="1" max="10000000" required placeholder="2499"></div></div><label>Product photo * (JPG / PNG / WEBP, max 4 MB)</label><input id="pImage" type="file" accept="image/jpeg,image/png,image/webp"><img id="preview" class="preview hide" alt="Image preview"><label>Description (optional)</label><textarea id="pDescription" maxlength="300" placeholder="Fabric, fit, details…"></textarea><label>Available sizes *</label><div class="sizes" id="sizeChecks">{['S','M','L','XL','XXL'].map(s=>`<label><input type="checkbox" value="${s}" checked> ${s}</label>`).join('')}</div><p id="productMessage" class="error"></p><button id="saveProduct">SAVE PRODUCT</button><button type="button" id="cancelEdit" class="hide" onclick="resetForm()">CANCEL EDIT</button></form></div><div class="panel"><h2>Your products</h2><div id="productList" class="muted">Loading…</div></div></div>
<div id="ordersView" class="hide"><div class="panel"><h2>Customer orders</h2><div id="stats" class="muted"></div></div><div id="orders"></div></div></section></main>
<script>
const $=id=>document.getElementById(id);let products=[];let selectedFile=null;
async function api(url,opts={}){const r=await fetch(url,{headers:{'Content-Type':'application/json'},...opts});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'Request failed');return d}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginError').textContent='';const f=new FormData(e.target);try{await api('/api/admin/login',{method:'POST',body:JSON.stringify({username:f.get('username'),password:f.get('password')})});$('login').classList.add('hide');$('dashboard').classList.remove('hide');$('logout').classList.remove('hide');await loadProducts();}catch(err){$('loginError').textContent=err.message}};
function showTab(tab){$('productsView').classList.toggle('hide',tab!=='products');$('ordersView').classList.toggle('hide',tab!=='orders');$('productsTab').classList.toggle('active',tab==='products');$('ordersTab').classList.toggle('active',tab==='orders');if(tab==='orders')loadOrders();else loadProducts()}
$('pImage').onchange=()=>{selectedFile=$('pImage').files[0]||null;if(selectedFile){if(selectedFile.size>4*1024*1024){$('productMessage').textContent='Image 4 MB se choti honi chahiye.';$('pImage').value='';selectedFile=null;return;}const url=URL.createObjectURL(selectedFile);$('preview').src=url;$('preview').classList.remove('hide')}};
async function uploadImage(file){const data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]);r.onerror=reject;r.readAsDataURL(file)});const d=await api('/api/admin/upload',{method:'POST',body:JSON.stringify({name:file.name,type:file.type,data})});return d.url}
$('productForm').onsubmit=async e=>{e.preventDefault();$('productMessage').textContent='';$('saveProduct').disabled=true;$('saveProduct').textContent='SAVING…';try{let image=products.find(p=>p.id===$('productId').value)?.image||'';if(selectedFile)image=await uploadImage(selectedFile);const sizes=[...$('sizeChecks').querySelectorAll('input:checked')].map(x=>x.value);const payload={name:$('pName').value.trim(),price:Number($('pPrice').value),image,sizes,description:$('pDescription').value,active:true};if(!image)throw Error('Product photo upload karein.');if(!sizes.length)throw Error('Kam az kam aik size select karein.');const id=$('productId').value;await api(id?'/api/admin/products/'+encodeURIComponent(id):'/api/admin/products',{method:id?'PUT':'POST',body:JSON.stringify(payload)});resetForm();await loadProducts();$('productMessage').textContent='';}catch(err){$('productMessage').textContent=err.message}finally{$('saveProduct').disabled=false;$('saveProduct').textContent='SAVE PRODUCT'}};
function resetForm(){$('productForm').reset();$('productId').value='';$('formTitle').textContent='Add a product';$('cancelEdit').classList.add('hide');$('preview').classList.add('hide');$('preview').src='';$('sizeChecks').querySelectorAll('input').forEach(x=>x.checked=true);selectedFile=null;$('productMessage').textContent=''}
async function loadProducts(){try{const d=await api('/api/admin/products');products=d.products||[];$('productList').innerHTML=products.length?products.map(p=>`<div class="product"><img src="${esc(p.image)}" alt=""><div><b>${esc(p.name)}</b><div>Rs. ${Number(p.price).toLocaleString('en-PK')} · Sizes: ${esc((p.sizes||[]).join(', '))}</div><small>${esc(p.description||'')}</small></div><div class="product-actions"><button onclick="editProduct('${p.id}')">EDIT</button><button class="danger" onclick="deleteProduct('${p.id}')">DELETE</button></div></div>`).join(''):'No products yet. Add your first product above.'}catch(e){$('productList').textContent=e.message}}
function editProduct(id){const p=products.find(x=>x.id===id);if(!p)return;$('productId').value=p.id;$('pName').value=p.name;$('pPrice').value=p.price;$('pDescription').value=p.description||'';$('preview').src=p.image;$('preview').classList.remove('hide');$('formTitle').textContent='Edit product';$('cancelEdit').classList.remove('hide');$('sizeChecks').querySelectorAll('input').forEach(x=>x.checked=(p.sizes||[]).includes(x.value));selectedFile=null;window.scrollTo({top:0,behavior:'smooth'})}
async function deleteProduct(id){if(!confirm('Is product ko delete karna hai?'))return;try{await api('/api/admin/products/'+encodeURIComponent(id),{method:'DELETE'});await loadProducts()}catch(e){alert(e.message)}}
async function loadOrders(){try{const {orders}=await api('/api/admin/orders');$('stats').textContent=`${orders.length} total orders · ${orders.filter(o=>o.status==='New').length} new`;$('orders').innerHTML=orders.length?orders.map(o=>`<article class="panel order"><div class="orderhead"><div><strong>${esc(o.id)}</strong><div class="muted">${new Date(o.createdAt).toLocaleString()}</div></div><strong>Rs. ${Number(o.total).toLocaleString('en-PK')}</strong></div><div class="ordergrid"><div><b>Customer</b><p>${esc(o.customer.name)}<br>${esc(o.customer.phone)}<br>${esc(o.customer.email)}</p></div><div><b>Delivery</b><p>${esc(o.customer.address)}<br>${esc(o.customer.city)}</p></div><div><b>Items</b><p>${o.items.map(i=>`${esc(i.name)} · ${esc(i.size)} × ${i.qty} — Rs. ${(i.price*i.qty).toLocaleString('en-PK')}`).join('<br>')}</p></div></div><p><b>Notes:</b> ${esc(o.customer.notes||'—')} · <b>Payment:</b> Cash on Delivery</p><label>Status</label><select onchange="changeStatus('${o.id}',this.value)">${['New','Confirmed','Dispatched','Delivered','Cancelled'].map(x=>`<option ${o.status===x?'selected':''}>${x}</option>`).join('')}</select></article>`).join(''):'<div class="panel">No orders yet.</div>'}catch(e){$('orders').textContent=e.message}}
async function changeStatus(id,status){try{await api('/api/admin/orders/'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify({status})});await loadOrders()}catch(e){alert(e.message)}}
async function logout(){await api('/api/admin/logout',{method:'POST'});location.reload()}
(async()=>{try{await api('/api/admin/orders');$('login').classList.add('hide');$('dashboard').classList.remove('hide');$('logout').classList.remove('hide');await loadProducts()}catch{}})();
</script></body></html>
